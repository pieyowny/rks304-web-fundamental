<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        evergreen: '#002A22',
                        blush: '#F5B0CB',
                        ash: '#9BC1BC',
                        taupe: '#5D576B',
                        deeppink: '#FF579F'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-ash flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96 border-t-8 border-evergreen">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-bold text-evergreen">Login Admin</h2>
            <p class="text-taupe text-sm mt-1">Masuk untuk mengelola produk digital</p>
        </div>
        <form action="dashboard.html">
            <div class="mb-4">
                <label class="block text-taupe font-semibold mb-2">Username</label>
                <input type="text" class="w-full p-2 border border-ash rounded focus:outline-none focus:ring-2 focus:ring-deeppink" required placeholder="Masukkan username">
            </div>
            <div class="mb-6">
                <label class="block text-taupe font-semibold mb-2">Password</label>
                <input type="password" class="w-full p-2 border border-ash rounded focus:outline-none focus:ring-2 focus:ring-deeppink" required placeholder="Masukkan password">
            </div>
            <button type="submit" class="w-full bg-deeppink text-white font-bold py-2 rounded hover:bg-blush hover:text-evergreen transition">Login</button>
        </form>
    </div>
</body>
</html>
